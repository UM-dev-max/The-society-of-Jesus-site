<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --wine:#4a0404;
  --wine-deep:#320209;
  --crimson:#7a1220;
  --scarlet:#9c1c22;
  --gold:#c9a227;
  --gold-soft:#e8d5a0;
  --gold-bright:#f2e3ae;
  --cream:#faf3e6;
  --parchment:#f3e8d0;
  --ink:#2b1710;
  --white:#fffdf8;
  --shadow: 0 10px 30px rgba(50,2,9,.25);
  --radius: 14px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(201,162,39,.16), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(122,18,32,.18), transparent 55%),
    var(--cream);
  color:var(--ink);
  font-family:'EB Garamond', serif;
  font-size:17px;
  line-height:1.5;
}

::selection{background:var(--gold-soft); color:var(--wine-deep);}

a{color:var(--crimson); text-decoration:none;}
a:hover{text-decoration:underline;}

h1,h2,h3{font-family:'Cormorant Garamond', serif; color:var(--wine-deep); margin:0 0 .3em;}
h1{font-weight:700;}
h2{font-weight:600; letter-spacing:.02em;}

.script{font-family:'Great Vibes', cursive; color:var(--wine-deep);}

/* ---------- top bars ---------- */
.topbar{
  display:flex; align-items:center; gap:14px;
  padding:16px 20px;
  background:linear-gradient(180deg, var(--wine) 0%, var(--wine-deep) 100%);
  box-shadow:var(--shadow);
  position:sticky; top:0; z-index:40;
}
.topbar .brand{display:flex; align-items:center; gap:12px;}
.topbar .brand img{width:44px; height:44px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
.topbar .brand .script{font-size:1.7rem; color:var(--gold-bright);}
.topbar.sign-in{justify-content:space-between;}
.topbar.main{justify-content:space-between;}
.topbar.main .left-actions{display:flex; align-items:center; gap:10px;}
.topbar.main .brand{flex-direction:row-reverse;}

.icon-btn{
  background:rgba(255,255,255,.08);
  border:1px solid var(--gold-soft);
  color:var(--gold-bright);
  border-radius:999px;
  width:42px; height:42px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition:transform .2s ease, background .2s ease;
  font-size:1.2rem;
}
.icon-btn:hover{transform:rotate(25deg) scale(1.06); background:rgba(255,255,255,.18);}

.back-link{
  color:var(--gold-bright); font-family:'Cormorant Garamond',serif; font-size:1.05rem;
  border:1px solid var(--gold-soft); padding:8px 14px; border-radius:999px;
  background:rgba(255,255,255,.06);
}
.back-link:hover{text-decoration:none; background:rgba(255,255,255,.16);}

/* ---------- sign-in ---------- */
.signin-wrap{
  min-height:calc(100vh - 80px);
  display:flex; align-items:center; justify-content:center;
  padding:40px 18px;
}
.signin-card{
  background:var(--white);
  border:1px solid var(--gold-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:40px 34px;
  width:100%; max-width:420px;
  text-align:center;
  animation:riseIn .7s ease both;
}
.signin-card img.seal{width:96px; margin-bottom:10px; animation:glow 3.5s ease-in-out infinite;}
.signin-card h1{font-size:1.9rem;}
.signin-card p.motto{color:var(--crimson); font-style:italic; margin-bottom:26px; font-family:'Cormorant Garamond',serif;}
.field{text-align:left; margin-bottom:20px;}
.field label{display:block; font-weight:600; margin-bottom:6px; color:var(--wine-deep); font-family:'Cormorant Garamond',serif;}
input[type=text],input[type=password],input[type=date],input[type=url],textarea,select{
  width:100%; padding:12px 14px; border-radius:10px;
  border:1.5px solid var(--gold-soft); background:var(--parchment);
  font-family:'EB Garamond',serif; font-size:1rem; color:var(--ink);
  transition:border-color .2s, box-shadow .2s;
}
input:focus,textarea:focus,select:focus{
  outline:none; border-color:var(--crimson); box-shadow:0 0 0 3px rgba(122,18,32,.15);
}
.btn{
  display:inline-block; border:none; cursor:pointer;
  background:linear-gradient(180deg, var(--scarlet), var(--wine-deep));
  color:var(--gold-bright); font-family:'Cormorant Garamond',serif; font-weight:700;
  font-size:1.05rem; letter-spacing:.03em;
  padding:12px 26px; border-radius:999px;
  box-shadow:0 6px 16px rgba(74,4,4,.35);
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(74,4,4,.45);}
.btn:active{transform:translateY(0);}
.btn.full{width:100%;}
.btn.gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:var(--wine-deep);}
.btn.ghost{background:transparent; color:var(--crimson); border:1.5px solid var(--crimson); box-shadow:none;}
.btn.danger{background:linear-gradient(180deg,#a4161a,#5c0a14);}
.btn.small{padding:7px 14px; font-size:.9rem;}

/* ---------- main content ---------- */
.container{max-width:1200px; margin:0 auto; padding:26px 18px 60px;}
.welcome{
  text-align:center; margin:8px 0 30px; animation:riseIn .6s ease both;
}
.welcome h1{font-size:2.1rem;}
.welcome .script{font-size:2.2rem;}

.section-title{
  display:flex; align-items:center; gap:12px; margin:34px 0 14px;
}
.section-title .rule{flex:1; height:1px; background:linear-gradient(90deg, var(--gold), transparent);}
.section-title h2{white-space:nowrap; font-size:1.5rem;}
.section-title .rule.rev{background:linear-gradient(270deg, var(--gold), transparent);}

.hscroll{
  display:flex; gap:16px; overflow-x:auto; padding:8px 4px 18px;
  scroll-snap-type:x proximity;
}
.hscroll::-webkit-scrollbar{height:8px;}
.hscroll::-webkit-scrollbar-thumb{background:var(--gold-soft); border-radius:8px;}
.hscroll::-webkit-scrollbar-track{background:transparent;}

/* news portrait cards */
.card-news{
  scroll-snap-align:start; flex:0 0 200px; height:290px;
  background:var(--white); border-radius:var(--radius); overflow:hidden;
  border:1px solid var(--gold-soft); box-shadow:var(--shadow); cursor:pointer;
  display:flex; flex-direction:column; transition:transform .2s ease;
  position:relative;
}
.card-news:hover{transform:translateY(-5px);}
.card-news .img{height:130px; background:linear-gradient(135deg,var(--parchment),var(--gold-soft)); background-size:cover; background-position:center;}
.card-news .body{padding:12px 14px; flex:1; display:flex; flex-direction:column;}
.card-news .body h3{font-size:1.05rem; margin:0 0 6px;}
.card-news .body p{font-size:.86rem; color:#5a463b; flex:1; overflow:hidden;}
.card-news .meta{font-size:.72rem; color:var(--crimson); margin-top:6px;}
.badge-urgent{
  position:absolute; top:8px; left:8px; background:var(--scarlet); color:#fff;
  font-size:.68rem; padding:3px 9px; border-radius:999px; letter-spacing:.05em;
  box-shadow:0 2px 6px rgba(0,0,0,.3); animation:pulse 1.8s infinite;
}

/* exam/poll landscape cards */
.card-wide{
  scroll-snap-align:start; flex:0 0 300px; height:150px;
  background:var(--white); border-radius:var(--radius);
  border:1px solid var(--gold-soft); box-shadow:var(--shadow); cursor:pointer;
  padding:16px; display:flex; flex-direction:column; justify-content:space-between;
  transition:transform .2s ease;
}
.card-wide:hover{transform:translateY(-4px);}
.card-wide .tag{font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--gold);
  background:var(--wine-deep); align-self:flex-start; padding:3px 10px; border-radius:999px;}
.card-wide h3{font-size:1.1rem; margin:6px 0 2px;}
.card-wide .meta{font-size:.78rem; color:#5a463b;}

/* books */
.card-book{
  scroll-snap-align:start; flex:0 0 190px; min-height:120px;
  background:linear-gradient(160deg, var(--wine-deep), var(--wine));
  color:var(--gold-bright); border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow); cursor:pointer; transition:transform .2s ease;
  display:flex; flex-direction:column; justify-content:space-between; border:1px solid var(--gold);
}
.card-book:hover{transform:translateY(-4px) scale(1.02);}
.card-book h3{color:var(--gold-bright); font-family:'Cormorant Garamond',serif; font-size:1.1rem; margin:0 0 6px;}
.card-book p{font-size:.8rem; opacity:.85; margin:0;}
.card-book .open{font-size:.75rem; margin-top:10px; color:var(--gold-soft);}

/* dioceses */
.dioceses-wrap{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end;}
.diocese-card{
  border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
  border:1px solid var(--gold-soft); position:relative; cursor:default;
  background:var(--white); transition:transform .2s ease;
}
.diocese-card:hover{transform:translateY(-4px);}
.diocese-card.important{flex:0 0 260px; height:190px;}
.diocese-card.minor{flex:0 0 160px; height:120px;}
.diocese-card .img{width:100%; height:70%; background-size:cover; background-position:center; background-color:var(--parchment);}
.diocese-card .name{
  position:absolute; bottom:0; left:0; right:0; padding:8px 10px;
  background:linear-gradient(0deg, rgba(50,2,9,.85), transparent);
  color:var(--gold-bright); font-family:'Great Vibes',cursive; font-size:1.3rem;
}
.diocese-card.important .name{font-size:1.6rem;}

/* empty state */
.empty{
  color:#8a7360; font-style:italic; padding:20px; text-align:center; border:1px dashed var(--gold-soft);
  border-radius:var(--radius); background:rgba(255,255,255,.4); width:100%;
}

/* settings panel */
.settings-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
.settings-tabs button{
  background:var(--white); border:1px solid var(--gold-soft); color:var(--wine-deep);
  font-family:'Cormorant Garamond',serif; font-weight:600; padding:9px 18px; border-radius:999px; cursor:pointer;
  transition:all .2s ease;
}
.settings-tabs button.active,.settings-tabs button:hover{background:var(--wine-deep); color:var(--gold-bright); border-color:var(--wine-deep);}
.panel{
  background:var(--white); border:1px solid var(--gold-soft); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px; animation:riseIn .4s ease both;
}
.panel h2{margin-top:0;}
.list-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--parchment);
}
.list-row:last-child{border-bottom:none;}

/* modal */
.modal-bg{
  position:fixed; inset:0; background:rgba(43,23,16,.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;
  animation:fadeIn .2s ease both;
}
.modal{
  background:var(--white); border-radius:var(--radius); border:1px solid var(--gold-soft);
  max-width:640px; width:100%; max-height:88vh; overflow-y:auto; padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.4); animation:riseIn .3s ease both;
}
.modal img{max-width:100%; border-radius:10px; margin:10px 0;}
.modal .close-x{float:right; cursor:pointer; font-size:1.4rem; color:var(--crimson); line-height:1;}

/* forms in admin */
.form-grid{display:grid; gap:14px;}
fieldset{border:1px solid var(--gold-soft); border-radius:10px; padding:14px; margin:0;}
legend{font-family:'Cormorant Garamond',serif; color:var(--wine-deep); font-weight:700; padding:0 6px;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.chip{
  background:var(--parchment); border:1px solid var(--gold-soft); border-radius:999px;
  padding:4px 12px; font-size:.85rem;
}
.pending{color:var(--scarlet); font-weight:600;}
.graded{color:#3a6b2a; font-weight:600;}

footer.site-footer{
  text-align:center; padding:26px; color:#8a7360; font-size:.85rem; font-family:'Cormorant Garamond',serif;
}
footer.site-footer .script{font-size:1.1rem;}

/* animations */
@keyframes riseIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(156,28,34,.6);} 50%{box-shadow:0 0 0 6px rgba(156,28,34,0);}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(201,162,39,.35));} 50%{filter:drop-shadow(0 0 14px rgba(201,162,39,.7));}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
}

@media (max-width:640px){
  .topbar .brand .script{font-size:1.3rem;}
  .welcome .script{font-size:1.7rem;}
  .signin-card{padding:28px 20px;}
}

}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw){
      const d = defaultDB();
      saveDB(d);
      return d;
    }
    const saved = JSON.parse(raw);
    // If a previous deployment created an empty database, hydrate it once
    // with the production starter content instead of showing an empty portal.
    const looksEmpty = !saved.news?.length && !saved.exams?.length &&
      !saved.polls?.length && !saved.books?.length && !saved.dioceses?.length &&
      !saved.socialLinks?.length;
    if(looksEmpty && !localStorage.getItem(DB_KEY + "_hydrated")){
      const d = defaultDB();
      d.users = saved.users || {};
      d.information = saved.information || d.information;
      d.roomsLink = saved.roomsLink || "";
      saveDB(d);
      localStorage.setItem(DB_KEY + "_hydrated", "1");
      return d;
    }
    return Object.assign(defaultDB(), saved);
  }catch(e){
    console.error(e);
    return defaultDB();
  }
}
function saveDB(db){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); return true; }
  catch(e){ alert("Storage is full — try removing an image or two before adding more."); return false; }
}
function getCurrentUser(){ return localStorage.getItem(SESSION_KEY) || ""; }
function setCurrentUser(name){ localStorage.setItem(SESSION_KEY, name); }
function isAdmin(){ return getCurrentUser() === ADMIN_KEY; }
function fmtDate(ts){ if(!ts) return ""; return new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function daysFromNow(n){ const d=new Date(); d.setDate(d.getDate()+Number(n)); return d.getTime(); }
function isExpired(ts){ return ts && Date.now() > Number(ts); }
function escapeHTML(str){ const div=document.createElement('div'); div.textContent = str ?? ""; return div.innerHTML; }
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function openModal(innerHTML){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><span class="close-x">&times;</span>${innerHTML}</div>`;
  bg.addEventListener('click', (e)=>{ if(e.target===bg) bg.remove(); });
  bg.querySelector('.close-x').addEventListener('click', ()=>bg.remove());
  document.body.appendChild(bg);
  return bg;
}

/* ---------------- router ---------------- */
function parseHash(){
  const raw = location.hash.slice(1) || 'signin';
  const [view, qs] = raw.split('?');
  return { view: view || 'signin', params: new URLSearchParams(qs || '') };
}
function goTo(view, params){
  let hash = '#' + view;
  if(params){ const qs = new URLSearchParams(params).toString(); if(qs) hash += '?' + qs; }
  location.hash = hash;
}
function renderRoute(){
  const { view, params } = parseHash();
  const app = document.getElementById('app');
  app.innerHTML = '';
  window.scrollTo(0,0);
  const user = getCurrentUser();

  if(view !== 'signin' && !user){ goTo('signin'); return; }
  if(view === 'admin' && user !== ADMIN_KEY){ goTo('main'); return; }
  if(user === ADMIN_KEY && view === 'main'){ goTo('admin'); return; }

  if(view === 'signin') return renderSignIn(app);
  if(view === 'main') return renderMain(app);
  if(view === 'settings') return renderSettings(app);
  if(view === 'news') return renderNewsDetail(app, params);
  if(view === 'exams') return renderExamTake(app, params);
  if(view === 'polls') return renderPollVote(app, params);
  if(view === 'admin') return renderAdmin(app);
  return renderSignIn(app);
}
window.addEventListener('hashchange', renderRoute);
window.addEventListener('DOMContentLoaded', renderRoute);

/* ================= MAIN MENU ================= */
function renderMain(app){
  const user = getCurrentUser();
  const db = loadDB();

  app.innerHTML = `
    ${topbarMain()}
    <div class="container">
      <div class="welcome"><h1>Welcome, <span class="script">${escapeHTML(user)}</span></h1></div>
      <div class="section-title"><div class="rule"></div><h2>News</h2><div class="rule rev"></div></div>
      <div class="hscroll" id="newsRow"></div>
      <div class="section-title"><div class="rule"></div><h2>Exams &amp; Polls</h2><div class="rule rev"></div></div>
      <div class="hscroll" id="examsPollsRow"></div>
      <div class="section-title"><div class="rule"></div><h2>Liturgical Books</h2><div class="rule rev"></div></div>
      <div class="hscroll" id="booksRow"></div>
      <div class="section-title"><div class="rule"></div><h2>Dioceses We Are With</h2><div class="rule rev"></div></div>
      <div class="dioceses-wrap" id="diocesesRow"></div>
    </div>
    ${footerHTML()}`;

  const newsRow = document.getElementById('newsRow');
  const activeNews = db.news.filter(n => !isExpired(n.expiresAt)).sort((a,b)=>(b.urgent-a.urgent)||(b.createdAt-a.createdAt));
  newsRow.innerHTML = activeNews.length === 0 ? `<div class="empty">No news at this time. Check back soon.</div>` :
    activeNews.map(n => `
      <div class="card-news" data-id="${n.id}">
        ${n.urgent ? '<span class="badge-urgent">Urgent</span>' : ''}
        <div class="img" style="${n.images && n.images[0] ? `background-image:url('${n.images[0]}')` : ''}"></div>
        <div class="body"><h3>${escapeHTML(n.title)}</h3><p>${escapeHTML(n.summary||'')}</p><div class="meta">Expires ${fmtDate(n.expiresAt)}</div></div>
      </div>`).join('');
  newsRow.querySelectorAll('.card-news').forEach(card => card.addEventListener('click', () => goTo('news', {id: card.dataset.id})));

  const epRow = document.getElementById('examsPollsRow');
  const activeExams = db.exams.filter(x=>!isExpired(x.expiresAt)).map(x=>({...x,kind:'exam'}));
  const activePolls = db.polls.filter(x=>!isExpired(x.expiresAt)).map(x=>({...x,kind:'poll'}));
  const combined = [...activeExams, ...activePolls].sort((a,b)=>(a.expiresAt||0)-(b.expiresAt||0));
  epRow.innerHTML = combined.length === 0 ? `<div class="empty">No exams or polls open right now.</div>` :
    combined.map(item => `
      <div class="card-wide" data-id="${item.id}" data-kind="${item.kind}">
        <span class="tag">${item.kind === 'exam' ? 'Exam' : 'Poll'}</span>
        <h3>${escapeHTML(item.title)}</h3><div class="meta">Closes ${fmtDate(item.expiresAt)}</div>
      </div>`).join('');
  epRow.querySelectorAll('.card-wide').forEach(card => card.addEventListener('click', () => goTo(card.dataset.kind + 's', {id: card.dataset.id})));

  const booksRow = document.getElementById('booksRow');
  booksRow.innerHTML = db.books.length === 0 ? `<div class="empty">No liturgical books have been added yet.</div>` :
    db.books.map(b => `
      <div class="card-book" data-link="${escapeHTML(b.link)}">
        <div><h3>${escapeHTML(b.name)}</h3><p>${escapeHTML(b.description||'')}</p></div>
        <div class="open">Open PDF &rarr;</div>
      </div>`).join('');
  booksRow.querySelectorAll('.card-book').forEach(card => card.addEventListener('click', () => window.open(card.dataset.link, '_blank', 'noopener')));

  const dRow = document.getElementById('diocesesRow');
  dRow.innerHTML = db.dioceses.length === 0 ? `<div class="empty">No dioceses have been added yet.</div>` :
    [...db.dioceses].sort((a,b)=>(b.important-a.important)).map(d => `
      <div class="diocese-card ${d.important ? 'important' : 'minor'}">
        <div class="img" style="${d.image ? `background-image:url('${d.image}')` : ''}"></div>
        <div class="name">${escapeHTML(d.name)}</div>
      </div>`).join('');
}

/* ================= NEWS DETAIL ================= */
function renderNewsDetail(app, params){
  const db = loadDB();
  const item = db.news.find(n => n.id === params.get('id'));
  app.innerHTML = `${topbarBack()}<div class="container" id="container"></div>${footerHTML()}`;
  const container = document.getElementById('container');
  if(!item){ container.innerHTML = `<div class="empty">This news item could not be found.</div>`; return; }
  const imagesHTML = (item.images||[]).map(src => `<img src="${src}" alt="">`).join('');
  const linksHTML = (item.links||[]).map(l => `<p><a href="${l.url}" target="_blank" rel="noopener">${escapeHTML(l.label||l.url)}</a></p>`).join('');
  container.innerHTML = `
    <div class="panel" style="animation:riseIn .5s ease both;">
      ${item.urgent ? '<span class="badge-urgent" style="position:static;display:inline-block;margin-bottom:10px;">Urgent</span>' : ''}
      <h1>${escapeHTML(item.title)}</h1>
      <p style="color:#8a7360;font-size:.9rem;">${isExpired(item.expiresAt)?'Expired':'Expires'} ${fmtDate(item.expiresAt)}</p>
      ${imagesHTML}
      <p style="white-space:pre-wrap;">${escapeHTML(item.details || item.summary || '')}</p>
      ${linksHTML}
    </div>`;
}

/* ================= EXAM TAKING ================= */
function renderExamTake(app, params){
  const user = getCurrentUser();
  const db = loadDB();
  const exam = db.exams.find(e => e.id === params.get('id'));
  app.innerHTML = `${topbarBack()}<div class="container" id="container"></div>${footerHTML()}`;
  const container = document.getElementById('container');
  if(!exam){ container.innerHTML = `<div class="empty">This exam could not be found.</div>`; return; }

  const mySubmission = (exam.submissions||[]).find(s => s.username === user);
  const expired = isExpired(exam.expiresAt);

  if(mySubmission){
    container.innerHTML = `
      <div class="panel"><h1>${escapeHTML(exam.title)}</h1><p>${escapeHTML(exam.description||'')}</p>
      <p>You have already submitted this exam.</p>
      <p>${mySubmission.graded ? `<span class="graded">Score: ${mySubmission.score} / 100</span>` : `<span class="pending">Awaiting grading by the admin</span>`}</p></div>`;
    return;
  }
  if(expired){
    container.innerHTML = `<div class="panel"><h1>${escapeHTML(exam.title)}</h1><p>This exam has closed and can no longer be taken.</p></div>`;
    return;
  }

  const qHTML = exam.questions.map((q,i) => {
    if(q.type === 'mcq'){
      const opts = q.options.map((o,oi) => `<label style="display:block;margin:6px 0;"><input type="radio" name="q_${q.id}" value="${oi}" required> ${escapeHTML(o)}</label>`).join('');
      return `<fieldset><legend>Question ${i+1} (multiple choice)</legend><p>${escapeHTML(q.prompt)}</p>${opts}</fieldset>`;
    }
    return `<fieldset><legend>Question ${i+1} (short answer)</legend><p>${escapeHTML(q.prompt)}</p><textarea name="q_${q.id}" rows="3" required></textarea></fieldset>`;
  }).join('');

  container.innerHTML = `
    <div class="panel">
      <h1>${escapeHTML(exam.title)}</h1><p>${escapeHTML(exam.description||'')}</p>
      <p style="font-size:.85rem;color:#8a7360;">Closes ${fmtDate(exam.expiresAt)} &middot; Taking as <strong>${escapeHTML(user)}</strong></p>
      <form id="examForm" class="form-grid">${qHTML}<button type="submit" class="btn full">Submit Exam</button></form>
    </div>`;

  document.getElementById('examForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const answers = {};
    let autoPoints = 0, hasText = false;
    const perQ = 100 / exam.questions.length;
    exam.questions.forEach(q => {
      if(q.type === 'mcq'){
        const val = e.target[`q_${q.id}`].value;
        answers[q.id] = Number(val);
        if(Number(val) === q.correctIndex) autoPoints += perQ;
      } else {
        hasText = true;
        answers[q.id] = e.target[`q_${q.id}`].value;
      }
    });
    const fresh = loadDB();
    const freshExam = fresh.exams.find(ex => ex.id === exam.id);
    freshExam.submissions = freshExam.submissions || [];
    freshExam.submissions.push({ username:user, answers, score:Math.round(autoPoints), graded:!hasText, gradedPoints:{}, submittedAt: Date.now() });
    saveDB(fresh);
    renderExamTake(app, params);
  });
}

/* ================= POLL VOTING ================= */
function pollResultsHTML(poll){
  const total = poll.votes.length;
  const counts = poll.options.map((_,i) => poll.votes.filter(v=>v.optionIndex===i).length);
  return poll.options.map((opt,i) => {
    const pct = total ? Math.round((counts[i]/total)*100) : 0;
    return `
      <div style="margin:12px 0;">
        <div class="row" style="justify-content:space-between;"><span>${escapeHTML(opt)}</span><span>${poll.showPercentage ? pct+'%' : counts[i]+' vote(s)'}</span></div>
        <div style="background:var(--parchment); border-radius:6px; overflow:hidden; height:10px;"><div style="width:${pct}%; background:linear-gradient(90deg,var(--gold),var(--crimson)); height:100%;"></div></div>
      </div>`;
  }).join('');
}
function renderPollVote(app, params){
  const user = getCurrentUser();
  const db = loadDB();
  const poll = db.polls.find(p => p.id === params.get('id'));
  app.innerHTML = `${topbarBack()}<div class="container" id="container"></div>${footerHTML()}`;
  const container = document.getElementById('container');
  if(!poll){ container.innerHTML = `<div class="empty">This poll could not be found.</div>`; return; }

  const myVote = poll.votes.find(v => v.username === user);
  const expired = isExpired(poll.expiresAt);

  if(myVote || expired){
    container.innerHTML = `
      <div class="panel"><h1>${escapeHTML(poll.title)}</h1>
      <p style="font-size:.85rem;color:#8a7360;">${expired?'Closed':'Closes'} ${fmtDate(poll.expiresAt)} ${poll.anonymous?'&middot; Anonymous poll':''}</p>
      ${myVote ? '<p>Your vote has been recorded. Thank you.</p>' : ''}
      ${pollResultsHTML(poll)}</div>`;
    return;
  }

  const opts = poll.options.map((o,i) => `<label style="display:block;margin:8px 0;"><input type="radio" name="opt" value="${i}" required> ${escapeHTML(o)}</label>`).join('');
  container.innerHTML = `
    <div class="panel"><h1>${escapeHTML(poll.title)}</h1>
    <p style="font-size:.85rem;color:#8a7360;">Closes ${fmtDate(poll.expiresAt)} ${poll.anonymous?'&middot; Your choice will not be shown publicly':''}</p>
    <form id="pollForm" class="form-grid">${opts}<button type="submit" class="btn full">Cast Vote</button></form></div>`;

  document.getElementById('pollForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = Number(e.target.opt.value);
    const fresh = loadDB();
    const freshPoll = fresh.polls.find(p => p.id === poll.id);
    freshPoll.votes = freshPoll.votes || [];
    freshPoll.votes.push({ username:user, optionIndex: val });
    saveDB(fresh);
    renderPollVote(app, params);
  });
}

/* ================= SETTINGS ================= */
function renderSettings(app){
  const user = getCurrentUser();
  const admin = isAdmin();
  app.innerHTML = `
    ${topbarBack()}
    <div class="container">
      <h1>Settings</h1>
      <div class="settings-tabs">
        <button data-tab="username" class="active">Edit Username</button>
        <button data-tab="olderNews">Older News</button>
        <button data-tab="socials">Social Links</button>
        <button data-tab="info">Information</button>
        <button data-tab="rooms">Rooms</button>
        ${admin ? '<button data-tab="grading">Grade Exams</button>' : ''}
      </div>
      <div class="panel" id="panel"></div>
    </div>
    ${footerHTML()}`;

  const panel = document.getElementById('panel');
  const buttons = document.querySelectorAll('.settings-tabs button');
  buttons.forEach(b => b.addEventListener('click', () => { buttons.forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(b.dataset.tab); }));

  function render(tab){
    const db = loadDB();
    if(tab === 'username') return renderUsername(db);
    if(tab === 'olderNews') return renderOlderNews(db);
    if(tab === 'socials') return renderSocials(db);
    if(tab === 'info') return renderInfo(db);
    if(tab === 'rooms') return renderRooms(db);
    if(tab === 'grading') return renderGrading(db);
  }

  function renderUsername(db){
    panel.innerHTML = `
      <h2>Edit Username</h2>
      <div class="field"><label>Your current name is <strong>${escapeHTML(user)}</strong></label>
      <input type="text" id="newName" placeholder="New name" value="${escapeHTML(user)}"></div>
      <button class="btn" id="saveName">Save</button><p id="nameMsg" style="margin-top:10px;"></p>`;
    document.getElementById('saveName').addEventListener('click', () => {
      const val = document.getElementById('newName').value.trim();
      if(!val) return;
      const fresh = loadDB();
      if(!fresh.users[val]) fresh.users[val] = { joined: Date.now() };
      saveDB(fresh);
      setCurrentUser(val);
      document.getElementById('nameMsg').textContent = "Saved! Your name is now " + val + ".";
      document.getElementById('nameMsg').className = "graded";
    });
  }

  function renderOlderNews(db){
    const expired = db.news.filter(n=>isExpired(n.expiresAt)).sort((a,b)=>b.expiresAt-a.expiresAt);
    panel.innerHTML = `<h2>Older News</h2>` + (expired.length===0 ? `<div class="empty">No expired news to show.</div>` :
      expired.map(n => `
        <div class="list-row" data-id="${n.id}">
          <div><strong>${escapeHTML(n.title)}</strong><br><span style="font-size:.85rem;color:#8a7360;">Expired ${fmtDate(n.expiresAt)}</span></div>
          <div class="row"><button class="btn ghost small view-old">View</button>${admin?'<button class="btn danger small del-old">Delete</button>':''}</div>
        </div>`).join(''));
    panel.querySelectorAll('.view-old').forEach(btn => btn.addEventListener('click', (e) => goTo('news', {id: e.target.closest('.list-row').dataset.id})));
    panel.querySelectorAll('.del-old').forEach(btn => btn.addEventListener('click', (e) => {
      if(!confirm('Delete this news permanently?')) return;
      const id = e.target.closest('.list-row').dataset.id;
      const fresh = loadDB(); fresh.news = fresh.news.filter(n=>n.id!==id); saveDB(fresh);
      renderOlderNews(loadDB());
    }));
  }

  function renderSocials(db){
    panel.innerHTML = `<h2>Social Links</h2>` +
      (db.socialLinks.length===0 ? `<div class="empty">No links added yet.</div>` :
        db.socialLinks.map(s => `
          <div class="list-row" data-id="${s.id}"><div><strong>${escapeHTML(s.label)}</strong></div>
          <div class="row"><a class="btn small" href="${s.url}" target="_blank" rel="noopener">Open</a>${admin?'<button class="btn danger small del-social">Remove</button>':''}</div></div>`).join('')) +
      (admin ? `<fieldset style="margin-top:18px;"><legend>Add a link</legend>
        <div class="row"><input type="text" id="socialLabel" placeholder="Label (e.g. Discord)" style="flex:1;">
        <input type="url" id="socialUrl" placeholder="https://..." style="flex:2;"><button class="btn small" id="addSocial">Add</button></div></fieldset>` : '');
    panel.querySelectorAll('.del-social').forEach(btn => btn.addEventListener('click', (e) => {
      const id = e.target.closest('.list-row').dataset.id;
      const fresh = loadDB(); fresh.socialLinks = fresh.socialLinks.filter(s=>s.id!==id); saveDB(fresh);
      renderSocials(loadDB());
    }));
    const addBtn = document.getElementById('addSocial');
    if(addBtn) addBtn.addEventListener('click', () => {
      const label = document.getElementById('socialLabel').value.trim();
      const url = document.getElementById('socialUrl').value.trim();
      if(!label || !url) return;
      const fresh = loadDB(); fresh.socialLinks.push({id: uid(), label, url}); saveDB(fresh);
      renderSocials(loadDB());
    });
  }

  function renderInfo(db){
    panel.innerHTML = `<h2>Information</h2><p style="white-space:pre-wrap;">${escapeHTML(db.information)}</p>
      ${admin ? `<textarea id="infoEdit" rows="8">${escapeHTML(db.information)}</textarea><div style="margin-top:10px;"><button class="btn" id="saveInfo">Save</button></div>` : ''}`;
    const saveBtn = document.getElementById('saveInfo');
    if(saveBtn) saveBtn.addEventListener('click', () => {
      const fresh = loadDB(); fresh.information = document.getElementById('infoEdit').value; saveDB(fresh);
      renderInfo(loadDB());
    });
  }

  function renderRooms(db){
    panel.innerHTML = `<h2>Rooms</h2>
      ${db.roomsLink ? `<p>The rooms sheet shows where each member is assigned.</p><a class="btn" href="${db.roomsLink}" target="_blank" rel="noopener">Open Rooms Sheet</a>` : `<div class="empty">No rooms link has been added yet.</div>`}
      ${admin ? `<fieldset style="margin-top:18px;"><legend>Set rooms link</legend>
        <div class="row"><input type="url" id="roomsUrl" placeholder="https://docs.google.com/spreadsheets/..." style="flex:1;" value="${db.roomsLink||''}"><button class="btn small" id="saveRooms">Save</button></div></fieldset>` : ''}`;
    const saveBtn = document.getElementById('saveRooms');
    if(saveBtn) saveBtn.addEventListener('click', () => {
      const fresh = loadDB(); fresh.roomsLink = document.getElementById('roomsUrl').value.trim(); saveDB(fresh);
      renderRooms(loadDB());
    });
  }

  function renderGrading(db){
    if(!admin){ panel.innerHTML = `<div class="empty">Admins only.</div>`; return; }
    const rows = [];
    db.exams.forEach(ex => (ex.submissions||[]).forEach(sub => rows.push({examId: ex.id, examTitle: ex.title, questions: ex.questions, ...sub})));
    panel.innerHTML = `<h2>Exam Submissions</h2>` + (rows.length===0 ? `<div class="empty">No submissions yet.</div>` :
      rows.map((r,idx) => `
        <div class="list-row" data-idx="${idx}">
          <div><strong>${escapeHTML(r.username)}</strong> — ${escapeHTML(r.examTitle)}<br><span style="font-size:.85rem;color:#8a7360;">Submitted ${fmtDate(r.submittedAt)}</span></div>
          <div class="row">${r.graded ? `<span class="graded">Score: ${r.score} / 100</span>` : `<span class="pending">Ungraded</span>`}<button class="btn ghost small grade-btn">${r.graded?'Review':'Grade'}</button></div>
        </div>`).join(''));
    panel.querySelectorAll('.grade-btn').forEach(btn => btn.addEventListener('click', (e) => openGradeModal(rows[e.target.closest('.list-row').dataset.idx])));
  }

  function openGradeModal(sub){
    const textQs = sub.questions.filter(q=>q.type!=='mcq');
    const mcqQs = sub.questions.filter(q=>q.type==='mcq');
    const perQ = 100 / sub.questions.length;
    const mcqSummary = mcqQs.map(q => {
      const given = sub.answers[q.id]; const correct = given === q.correctIndex;
      return `<p>MCQ: "${escapeHTML(q.prompt)}" — answered "${escapeHTML(q.options[given] ?? '—')}" ${correct?'(correct)':'(incorrect)'}</p>`;
    }).join('');
    const textFields = textQs.map(q => `
      <fieldset><legend>${escapeHTML(q.prompt)}</legend><p style="white-space:pre-wrap;">${escapeHTML(sub.answers[q.id]||'')}</p>
      <label>Points (0–${perQ.toFixed(1)})</label>
      <input type="number" min="0" max="${perQ}" step="0.5" class="text-points" data-qid="${q.id}" value="${(sub.gradedPoints && sub.gradedPoints[q.id]) || 0}"></fieldset>`).join('');
    const m = openModal(`<h2>Grade — ${escapeHTML(sub.username)}</h2>${mcqSummary}${textFields || '<p>No open questions to grade.</p>'}<button class="btn full" id="commitGrade" style="margin-top:14px;">Save Grade</button>`);
    m.querySelector('#commitGrade').addEventListener('click', () => {
      let autoPoints = 0; mcqQs.forEach(q => { if(sub.answers[q.id]===q.correctIndex) autoPoints += perQ; });
      let textPoints = 0; const gradedPoints = {};
      m.querySelectorAll('.text-points').forEach(inp => { const val = Math.min(Number(inp.value)||0, perQ); gradedPoints[inp.dataset.qid]=val; textPoints+=val; });
      const fresh = loadDB();
      const freshExam = fresh.exams.find(ex=>ex.id===sub.examId);
      const freshSub = freshExam.submissions.find(s=>s.username===sub.username && s.submittedAt===sub.submittedAt);
      freshSub.score = Math.round(autoPoints + textPoints);
      freshSub.graded = true;
      freshSub.gradedPoints = gradedPoints;
      saveDB(fresh);
      m.remove();
      render('grading');
    });
  }

  render('username');
}

    <div class="container">
      <h1>Administration</h1>
      <div class="settings-tabs">
        <button data-tab="news" class="active">News</button>
        <button data-tab="exams">Exams</button>
        <button data-tab="polls">Polls</button>
        <button data-tab="dioceses">Dioceses</button>
        <button data-tab="books">Liturgical Books</button>
        <button data-tab="users">Users</button>
      </div>
      <div class="panel" id="panel"></div>
    </div>
    ${footerHTML()}`;

  const panel = document.getElementById('panel');
  const buttons = document.querySelectorAll('.settings-tabs button');
  buttons.forEach(b => b.addEventListener('click', () => { buttons.forEach(x=>x.classList.remove('active')); b.classList.add('active'); render(b.dataset.tab); }));

  function render(tab){
    if(tab==='news') return renderNews();
    if(tab==='exams') return renderExams();
    if(tab==='polls') return renderPolls();
    if(tab==='dioceses') return renderDioceses();
    if(tab==='books') return renderBooks();
    if(tab==='users') return renderUsers();
  }

  function renderNews(){
    const db = loadDB();
    const active = db.news.filter(n=>!isExpired(n.expiresAt));
    panel.innerHTML = `<h2>News</h2>
      ${active.length===0?'<div class="empty">No active news.</div>':active.map(n=>`
        <div class="list-row" data-id="${n.id}"><div><strong>${escapeHTML(n.title)}</strong> ${n.urgent?'<span class="chip">Urgent</span>':''}<br>
        <span style="font-size:.85rem;color:#8a7360;">Expires ${fmtDate(n.expiresAt)}</span></div><button class="btn danger small del-news">Delete</button></div>`).join('')}
      <fieldset style="margin-top:20px;"><legend>Add News</legend>
        <form id="newsForm" class="form-grid">
          <div class="field"><label>Title</label><input type="text" id="nTitle" required></div>
          <div class="field"><label>Summary (shown on card)</label><input type="text" id="nSummary" required></div>
          <div class="field"><label>Details (shown when opened)</label><textarea id="nDetails" rows="4"></textarea></div>
          <div class="field"><label>Link label (optional)</label><input type="text" id="nLinkLabel"></div>
          <div class="field"><label>Link URL (optional)</label><input type="url" id="nLinkUrl"></div>
          <div class="field"><label>Image(s)</label><input type="file" id="nImages" accept="image/*" multiple></div>
          <div class="field"><label>Expires in (days, max 10)</label><input type="number" id="nDays" min="1" max="10" value="7" required></div>
          <label><input type="checkbox" id="nUrgent"> Mark as urgent</label>
          <button type="submit" class="btn full">Publish News</button>
        </form></fieldset>`;
    panel.querySelectorAll('.del-news').forEach(btn => btn.addEventListener('click', (e) => {
      const id = e.target.closest('.list-row').dataset.id;
      const fresh = loadDB(); fresh.news = fresh.news.filter(n=>n.id!==id); saveDB(fresh); renderNews();
    }));
    document.getElementById('newsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const files = document.getElementById('nImages').files;
      const images = []; for(const f of files){ images.push(await fileToDataURL(f)); }
      const days = Math.min(10, Math.max(1, Number(document.getElementById('nDays').value)));
      const links = [];
      const ll = document.getElementById('nLinkLabel').value.trim();
      const lu = document.getElementById('nLinkUrl').value.trim();
      if(lu) links.push({ label: ll||lu, url: lu });
      const fresh = loadDB();
      fresh.news.push({ id: uid(), title: document.getElementById('nTitle').value.trim(), summary: document.getElementById('nSummary').value.trim(),
        details: document.getElementById('nDetails').value.trim(), images, links, urgent: document.getElementById('nUrgent').checked,
        createdAt: Date.now(), expiresAt: daysFromNow(days) });
      saveDB(fresh); renderNews();
    });
  }

  let examQuestions = [];
  function qEditorHTML(q,i){
    if(q.type==='mcq'){
      const optsHTML = q.options.map((o,oi) => `
        <div class="row" style="margin:4px 0;">
          <input type="radio" name="correct_${i}" ${oi===q.correctIndex?'checked':''} class="correct-radio" data-qi="${i}" data-oi="${oi}">
          <input type="text" class="opt-input" data-qi="${i}" data-oi="${oi}" value="${escapeHTML(o)}" placeholder="Option ${oi+1}" style="flex:1;">
        </div>`).join('');
      return `<fieldset><legend>Question ${i+1} — Multiple choice</legend>
        <input type="text" class="q-prompt" data-qi="${i}" placeholder="Question text" value="${escapeHTML(q.prompt)}">
        ${optsHTML}
        <div class="row" style="margin-top:6px;"><button type="button" class="btn ghost small add-opt" data-qi="${i}">+ Option</button>
        <button type="button" class="btn danger small rm-q" data-qi="${i}">Remove Question</button></div>
        <p style="font-size:.8rem;color:#8a7360;">Select the radio button beside the correct option.</p></fieldset>`;
    }
    return `<fieldset><legend>Question ${i+1} — Open-ended (graded by admin)</legend>
      <input type="text" class="q-prompt" data-qi="${i}" placeholder="Question text" value="${escapeHTML(q.prompt)}">
      <div class="row" style="margin-top:6px;"><button type="button" class="btn danger small rm-q" data-qi="${i}">Remove Question</button></div></fieldset>`;
  }
  function renderQList(){
    const qList = document.getElementById('qList');
    qList.innerHTML = examQuestions.map((q,i) => qEditorHTML(q,i)).join('');
    qList.querySelectorAll('.q-prompt').forEach(inp => inp.addEventListener('input', (e) => { examQuestions[e.target.dataset.qi].prompt = e.target.value; }));
    qList.querySelectorAll('.opt-input').forEach(inp => inp.addEventListener('input', (e) => { examQuestions[e.target.dataset.qi].options[e.target.dataset.oi] = e.target.value; }));
    qList.querySelectorAll('.correct-radio').forEach(r => r.addEventListener('change', (e) => { examQuestions[e.target.dataset.qi].correctIndex = Number(e.target.dataset.oi); }));
    qList.querySelectorAll('.add-opt').forEach(btn => btn.addEventListener('click', (e) => { examQuestions[e.target.dataset.qi].options.push(''); renderQList(); }));
    qList.querySelectorAll('.rm-q').forEach(btn => btn.addEventListener('click', (e) => { examQuestions.splice(Number(e.target.dataset.qi),1); renderQList(); }));
  }
  function renderExams(){
    const db = loadDB(); examQuestions = [];
    panel.innerHTML = `<h2>Exams</h2>
      ${db.exams.length===0?'<div class="empty">No exams yet.</div>':db.exams.map(x=>`
        <div class="list-row" data-id="${x.id}"><div><strong>${escapeHTML(x.title)}</strong><br>
        <span style="font-size:.85rem;color:#8a7360;">${x.questions.length} question(s) &middot; ${x.submissions.length} submission(s) &middot; ${isExpired(x.expiresAt)?'Closed':'Open until '+fmtDate(x.expiresAt)}</span></div>
        <button class="btn danger small del-exam">Delete</button></div>`).join('')}
      <fieldset style="margin-top:20px;"><legend>Create Exam</legend>
        <div class="form-grid">
          <div class="field"><label>Title</label><input type="text" id="eTitle" required></div>
          <div class="field"><label>Description</label><textarea id="eDesc" rows="2"></textarea></div>
          <div class="field"><label>Expiration date</label><input type="date" id="eDate" required></div>
          <div id="qList"></div>
          <div class="row"><button type="button" class="btn ghost small" id="addMCQ">+ Multiple choice question</button>
          <button type="button" class="btn ghost small" id="addText">+ Open-ended question</button></div>
          <button type="button" class="btn full" id="createExam">Create Exam</button>
        </div></fieldset>`;
    panel.querySelectorAll('.del-exam').forEach(btn => btn.addEventListener('click', (e) => {
      const id = e.target.closest('.list-row').dataset.id;
      const fresh = loadDB(); fresh.exams = fresh.exams.filter(x=>x.id!==id); saveDB(fresh); renderExams();
    }));
    document.getElementById('addMCQ').addEventListener('click', () => { examQuestions.push({id:uid(),type:'mcq',prompt:'',options:['',''],correctIndex:0}); renderQList(); });
    document.getElementById('addText').addEventListener('click', () => { examQuestions.push({id:uid(),type:'text',prompt:''}); renderQList(); });
    document.getElementById('createExam').addEventListener('click', () => {
      const title = document.getElementById('eTitle').value.trim();
      const dateVal = document.getElementById('eDate').value;
      if(!title || !dateVal || examQuestions.length===0){ alert('Please add a title, an expiration date, and at least one question.'); return; }
      const fresh = loadDB();
      fresh.exams.push({ id: uid(), title, description: document.getElementById('eDesc').value.trim(), questions: examQuestions, submissions: [],
        expiresAt: new Date(dateVal).getTime(), createdAt: Date.now() });
      saveDB(fresh); renderExams();
    });
    renderQList();
  }

  let pollOptions = ['',''];
  function renderPollOptions(){
    const list = document.getElementById('pollOptList');
    list.innerHTML = pollOptions.map((o,i) => `
      <div class="row" style="margin:4px 0;"><input type="text" class="poll-opt" data-i="${i}" value="${escapeHTML(o)}" placeholder="Option ${i+1}" style="flex:1;">
      <button type="button" class="btn danger small rm-popt" data-i="${i}">&times;</button></div>`).join('');
    list.querySelectorAll('.poll-opt').forEach(inp => inp.addEventListener('input', (e) => { pollOptions[e.target.dataset.i] = e.target.value; }));
    list.querySelectorAll('.rm-popt').forEach(btn => btn.addEventListener('click', (e) => { pollOptions.splice(Number(e.target.dataset.i),1); renderPollOptions(); }));
  }
  function renderPolls(){
    const db = loadDB(); pollOptions = ['',''];
    panel.innerHTML = `<h2>Polls</h2>
      ${db.polls.length===0?'<div class="empty">No polls yet.</div>':db.polls.map(p=>`
        <div class="list-row" data-id="${p.id}"><div><strong>${escapeHTML(p.title)}</strong><br>
        <span style="font-size:.85rem;color:#8a7360;">${p.votes.length} vote(s) &middot; ${isExpired(p.expiresAt)?'Closed':'Open until '+fmtDate(p.expiresAt)} ${p.anonymous?'&middot; Anonymous':''}</span></div>
        <div class="row"><button class="btn ghost small view-votes">Who Voted</button><button class="btn danger small del-poll">Delete</button></div></div>`).join('')}
      <fieldset style="margin-top:20px;"><legend>Create Poll</legend>
        <div class="form-grid">
          <div class="field"><label>Title / Question</label><input type="text" id="pTitle" required></div>
          <div id="pollOptList"></div>
          <button type="button" class="btn ghost small" id="addPollOpt">+ Option</button>
          <div class="field"><label>Expiration date</label><input type="date" id="pDate" required></div>
          <label><input type="checkbox" id="pAnon"> Anonymous (admin can still see who voted below)</label>
          <label><input type="checkbox" id="pPct" checked> Show results as percentage (unchecked = show raw vote counts)</label>
          <button type="button" class="btn full" id="createPoll">Create Poll</button>
        </div></fieldset>`;
    panel.querySelectorAll('.del-poll').forEach(btn => btn.addEventListener('click', (e) => {
      const id = e.target.closest('.list-row').dataset.id;
      const fresh = loadDB(); fresh.polls = fresh.polls.filter(p=>p.id!==id); saveDB(fresh); renderPolls();
    }));
    panel.querySelectorAll('.view-votes').forEach(btn => btn.addEventListener('click', (e) => {
      const id = e.target.closest('.list-row').dataset.id;
      const poll = db.polls.find(p=>p.id===id);
      const rows = poll.votes.map(v => `<div class="list-row"><span>${escapeHTML(v.username)}</span><span>${escapeHTML(poll.options[v.optionIndex])}</span></div>`).join('') || '<div class="empty">No votes yet.</div>';
      openModal(`<h2>${escapeHTML(poll.title)} — Voters</h2>${rows}`);
    }));
    document.getElementById('addPollOpt').addEventListener('click', () => { pollOptions.push(''); renderPollOptions(); });
    document.getElementById('createPoll').addEventListener('click', () => {
      const title = document.getElementById('pTitle').value.trim();
      const dateVal = document.getElementById('pDate').value;
      const opts = pollOptions.map(o=>o.trim()).filter(Boolean);
      if(!title || !dateVal || opts.length<2){ alert('Please add a title, expiration date, and at least two options.'); return; }
      const fresh = loadDB();
      fresh.polls.push({ id: uid(), title, options: opts, anonymous: document.getElementById('pAnon').checked, showPercentage: document.getElementById('pPct').checked,
        votes: [], expiresAt: new Date(dateVal).getTime(), createdAt: Date.now() });
      saveDB(fresh); renderPolls();
    });
    renderPollOptions();
  }

  function renderDioceses(){
    const db = loadDB();
    panel.innerHTML = `<h2>Dioceses</h2>
      ${db.dioceses.length===0?'<div class="empty">No dioceses yet.</div>':db.dioceses.map(d=>`
        <div class="list-row" data-id="${d.id}"><div><strong>${escapeHTML(d.name)}</strong> ${d.important?'<span class="chip">Important</span>':''}</div>
        <button class="btn danger small del-dio">Delete</button></div>`).join('')}
      <fieldset style="margin-top:20px;"><legend>Add Diocese</legend>
        <form id="dioForm" class="form-grid">
          <div class="field"><label>Name</label><input type="text" id="dName" required></div>
          <div class="field"><label>Photo</label><input type="file" id="dImage" accept="image/*"></div>
          <label><input type="checkbox" id="dImportant"> Important (shown larger, at the top)</label>
          <button type="submit" class="btn full">Add Diocese</button>
        </form></fieldset>`;
    panel.querySelectorAll('.del-dio').forEach(btn => btn.addEventListener('click', (e) => {
      const id = e.target.closest('.list-row').dataset.id;
      const fresh = loadDB(); fresh.dioceses = fresh.dioceses.filter(d=>d.id!==id); saveDB(fresh); renderDioceses();
    }));
    document.getElementById('dioForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('dImage').files[0];
      const image = file ? await fileToDataURL(file) : '';
      const fresh = loadDB();
      fresh.dioceses.push({ id: uid(), name: document.getElementById('dName').value.trim(), image, important: document.getElementById('dImportant').checked });
      saveDB(fresh); renderDioceses();
    });
  }

  function renderBooks(){
    const db = loadDB();
    panel.innerHTML = `<h2>Liturgical Books</h2>
      ${db.books.length===0?'<div class="empty">No books yet.</div>':db.books.map(b=>`
        <div class="list-row" data-id="${b.id}"><div><strong>${escapeHTML(b.name)}</strong><br>
        <span style="font-size:.85rem;color:#8a7360;">${escapeHTML(b.description||'')}</span></div>
        <button class="btn danger small del-book">Delete</button></div>`).join('')}
      <fieldset style="margin-top:20px;"><legend>Add Book</legend>
        <form id="bookForm" class="form-grid">
          <div class="field"><label>Name</label><input type="text" id="bName" required></div>
          <div class="field"><label>Description</label><input type="text" id="bDesc"></div>
          <div class="field"><label>Google Drive link (PDF)</label><input type="url" id="bLink" placeholder="https://drive.google.com/..." required></div>
          <button type="submit" class="btn full">Add Book</button>
        </form></fieldset>`;
    panel.querySelectorAll('.del-book').forEach(btn => btn.addEventListener('click', (e) => {
      const id = e.target.closest('.list-row').dataset.id;
      const fresh = loadDB(); fresh.books = fresh.books.filter(b=>b.id!==id); saveDB(fresh); renderBooks();
    }));
    document.getElementById('bookForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const fresh = loadDB();
      fresh.books.push({ id: uid(), name: document.getElementById('bName').value.trim(), description: document.getElementById('bDesc').value.trim(), link: document.getElementById('bLink').value.trim() });
      saveDB(fresh); renderBooks();
    });
  }

  function renderUsers(){
    const db = loadDB();
    const names = Object.keys(db.users).filter(n => n !== ADMIN_KEY);
    panel.innerHTML = `<h2>Registered Users</h2>
      ${names.length===0?'<div class="empty">No users have signed in yet.</div>':names.map(n=>`
        <div class="list-row"><span>${escapeHTML(n)}</span><span style="font-size:.85rem;color:#8a7360;">Joined ${fmtDate(db.users[n].joined)}</span></div>`).join('')}`;
  }

  render('news');
}

</script>
</body>
</html>
